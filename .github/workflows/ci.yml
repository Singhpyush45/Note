name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build, unit & Robolectric tests, lint
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write # only to publish screenshots/schemas/log to the `ci-output` branch
    steps:
      - uses: actions/checkout@v5
      - uses: gradle/actions/wrapper-validation@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5

      - name: Build and test
        id: gradle
        run: |
          set -o pipefail
          ./gradlew assembleDebug assembleRelease :core:common:test :core:domain:test testDebugUnitTest lintDebug --continue --warning-mode all 2>&1 | tee build.log

      - name: Check database schema is committed
        run: |
          if [ -n "$(git status --porcelain core/database/schemas)" ]; then
            echo "::error title=Room schema not committed::The build generated a new or changed Room schema. Commit core/database/schemas (it is published to the ci-output branch)."
            git status --porcelain core/database/schemas
            exit 1
          fi

      - name: Report results
        if: always()
        run: python3 .github/scripts/report.py build build.log "**/build/test-results/testDebugUnitTest/**/*.xml" "core/*/build/test-results/test/**/*.xml"

      - name: Publish screenshots and DB schemas to the `ci-output` branch
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ci-output
          [ -d app/build/screenshots ] && cp -r app/build/screenshots ci-output/
          [ -d core/database/schemas ] && cp -r core/database/schemas ci-output/
          cp build.log ci-output/ 2>/dev/null || true
          cd ci-output
          git init -q -b ci-output
          git add .
          git -c user.name="ci" -c user.email="ci@users.noreply.github.com" commit -qm "CI output for ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-output

      - name: Upload APKs
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: apks
          path: app/build/outputs/apk/**/*.apk
          retention-days: 14

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: build-reports
          path: |
            **/build/reports/
            build.log
          retention-days: 7

  instrumented:
    name: Emulator tests + release smoke test
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5

      - name: Enable KVM (hardware acceleration for the emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Pre-build APKs
        run: ./gradlew assembleDebug assembleDebugAndroidTest assembleRelease :e2e:assembleDebug

      - name: Run on emulator (API 35)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/emulator-tests.sh

      - name: Report results
        if: always()
        run: python3 .github/scripts/report.py instrumented instrumented.log "**/build/outputs/androidTest-results/connected/**/*.xml"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: instrumented-reports
          path: |
            **/build/reports/androidTests/
            instrumented.log
          retention-days: 7
