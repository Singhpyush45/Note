name: Build QuickNote APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Release & Debug APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build QuickNote Release & Debug APKs
        run: ./gradlew assembleRelease assembleDebug --no-daemon

      - name: Upload QuickNote Release APK
        uses: actions/upload-artifact@v4
        with:
          name: QuickNote-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload QuickNote Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: QuickNote-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
