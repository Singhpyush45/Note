name: probe-versions
on:
  push:
    branches: [probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Vosk
        run: |
          exec > >(tee /tmp/out.txt) 2>&1
          for m in vosk-model-small-en-in-0.4 vosk-model-small-en-us-0.15 vosk-model-small-hi-0.22; do
            echo "$m $(curl -sIL https://alphacephei.com/vosk/models/$m.zip | grep -iE '^(HTTP|content-length)' | tr '\r\n' '  ')"
          done
          curl -fsSL https://repo1.maven.org/maven2/com/alphacephei/vosk-android/0.3.75/vosk-android-0.3.75.pom
          mkdir x && cd x && curl -fsSLO https://repo1.maven.org/maven2/com/alphacephei/vosk-android/0.3.75/vosk-android-0.3.75.aar && unzip -l vosk-android-0.3.75.aar | head -30
          unzip -o -q vosk-android-0.3.75.aar classes.jar && unzip -l classes.jar | grep -i "vosk/" | head -30
          for m in vosk-model-small-en-in-0.4 vosk-model-small-hi-0.22; do curl -fsSL -o $m.zip https://alphacephei.com/vosk/models/$m.zip && unzip -l $m.zip | head -25 && sha256sum $m.zip; done
          sleep 1; msg=$(sed -e ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' /tmp/out.txt); echo "::notice title=vosk::$msg"
