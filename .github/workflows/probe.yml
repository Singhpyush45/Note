name: probe-versions
on:
  push:
    branches: [probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Segmentation
        run: |
          exec > >(tee /tmp/out.txt) 2>&1
          G=https://dl.google.com/dl/android/maven2
          curl -fsSL "$G/com/google/android/gms/play-services-mlkit-subject-segmentation/maven-metadata.xml" | grep -o '<version>[^<]*' | tail -5
          V=$(curl -fsSL "$G/com/google/android/gms/play-services-mlkit-subject-segmentation/maven-metadata.xml" | grep -o '<version>[^<]*' | tail -1 | sed 's/<version>//')
          echo "V=$V"
          curl -fsSL "$G/com/google/android/gms/play-services-mlkit-subject-segmentation/$V/play-services-mlkit-subject-segmentation-$V.pom" | grep -A2 artifactId | head -40
          mkdir x && cd x && curl -fsSLo s.aar "$G/com/google/android/gms/play-services-mlkit-subject-segmentation/$V/play-services-mlkit-subject-segmentation-$V.aar" && unzip -o -q s.aar classes.jar && unzip -l classes.jar | grep -i "segmentation/subject" | head -30
          javap -cp classes.jar com.google.mlkit.vision.segmentation.subject.SubjectSegmenterOptions\$Builder com.google.mlkit.vision.segmentation.subject.SubjectSegmentationResult com.google.mlkit.vision.segmentation.subject.SubjectSegmentation 2>&1 | head -40
          sleep 1; msg=$(sed -e ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' /tmp/out.txt); echo "::notice title=seg::$msg"
